version: '3.8'

services:
  citrix-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citrix_website_app
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - NUXT_GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: always
